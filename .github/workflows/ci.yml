name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      # Offline suite: FakeLLM + in-memory citation universe + respx-mocked WoS; no API keys needed
      - run: python -m pytest -q
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --test tests/unit/test_network_layout.cjs
