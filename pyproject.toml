[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scibooster"
version = "0.1.0"
description = "DeepSeek-driven literature retrieval agent harness (WoS Starter + OpenAlex) with citation-graph renderer, recall evaluation and BibTeX/RIS export"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "pyalex>=0.15",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "networkx>=3.2",
    "rank-bm25>=0.2.2",
    "tenacity>=8.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "pyyaml>=6"]

[project.scripts]
scibooster = "scibooster.cli:app"

[tool.setuptools.packages.find]
include = ["scibooster*", "renderer*"]

[tool.setuptools.package-data]
renderer = ["static/*", "static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
